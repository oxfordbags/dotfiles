# ~/.tmux.conf

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
# Flavour follows the macOS appearance: mocha in dark mode, latte in light mode.
# Only detected when unset, so reloading the config keeps the current flavour;
# the theme hooks below switch it live.
if -F '#{==:#{@catppuccin_flavor},}' {
  if 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' 'set -g @catppuccin_flavor "mocha"' 'set -g @catppuccin_flavor "latte"'
}
set -g @catppuccin_window_status_style "rounded"
# Tab text: window name (#W), as in oh-my-tmux. The plugin default is the pane title (#T), which is the full hostname.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"

# Switch flavour when the terminal reports a light/dark change
set-hook -g client-light-theme 'run-shell "~/.config/tmux/set-flavor.sh latte"'
set-hook -g client-dark-theme 'run-shell "~/.config/tmux/set-flavor.sh mocha"'

# -- key bindings (from oh-my-tmux) --------------------------------------------

# Settings the bindings below rely on
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # longer window for repeatable (-r) bindings
set -s focus-events on

set -g base-index 1                       # start windows numbering at 1
setw -g pane-base-index 1                 # make pane numbering consistent with windows
setw -g mode-keys vi                      # enables the copy-mode-vi bindings below

set -g set-titles on                      # set the terminal tab title...
set -g set-titles-string "#h ❐ #S ● #I #W"  # ...to: short-hostname ❐ session ● window-index window-name

set -g prefix C-a                         # C-a replaces C-b (no secondary prefix)
unbind C-b
bind C-a send-prefix

# edit / reload configuration
bind e new-window -n "tmux.conf" "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Configuration reloaded\"'"
bind r source-file ~/.tmux.conf \; display "Configuration reloaded"

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# sessions
bind C-c new-session
bind C-f command-prompt -p '(find-session)' 'switch-client -t %%'
bind BTab switch-client -l                # move to last session

# splits (new panes keep the current directory, as oh-my-tmux does by default)
bind - split-window -v -c "#{pane_current_path}"   # split current window horizontally
bind _ split-window -h -c "#{pane_current_path}"   # split current window vertically
bind '"' split-window -v -c "#{pane_current_path}" # stock bindings, same treatment
bind % split-window -h -c "#{pane_current_path}"

# pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D                       # swap current pane with the next one
bind < swap-pane -U                       # swap current pane with the previous one

# maximize / restore current pane
bind + resize-pane -Z

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind 0 select-window -t :=10              # <prefix> 0 selects window 10
bind -n M-H swap-window -t -1 \; select-window -t -1   # Alt+Shift+h: move window left
bind -n M-L swap-window -t +1 \; select-window -t +1   # Alt+Shift+l: move window right
bind Tab last-window                      # move to last active window

# toggle mouse
bind m set -gF mouse '#{?mouse,off,on}' \; display "mouse: #{?mouse,on,off}"

# copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# copy top paste buffer to the macOS clipboard
bind y run -b "tmux save-buffer - | pbcopy"

# buffers
bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# personal additions (carried over from tmux.conf.local.old)
bind -n M-h previous-window
bind -n M-l next-window
bind -n S-Right select-pane -t :.+
bind -n S-Left select-pane -t :.-
set -g set-clipboard on
